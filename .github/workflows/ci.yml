name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token; a newer push to the same branch cancels the older run.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two independent jobs: the Laravel API, and the public website in frontend/ (its own package.json and lockfile).
# Local development uses the Supabase CLI's Postgres; CI uses the same PostgreSQL major version as a plain service
# container (no Supabase account or keys involved). The staff portal has its own CI in the Road-trip-admin repo.
env:
  PHP_VERSION: '8.3'
  NODE_VERSION: 24
  PNPM_VERSION: 12.16.1

jobs:
  backend:
    name: Laravel tests, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      # Code style (Laravel Pint) is not enforced yet: 58 files need a one-off formatting commit first (owner approval).
      - name: Environment and databases
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/" .env
          sh scripts/setup-local-db.sh
      - run: php artisan test

  frontend:
    name: Public website (lint, types, unit tests, build, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build-only
      - run: pnpm audit --prod

  frontend-e2e:
    name: Public website E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # One job per browser project, in parallel. WebKit has never run green (it cannot launch on the development
    # machine without system libraries); it reports but does not block until its first green run, then remove this.
    continue-on-error: ${{ matrix.project == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile, webkit]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['54324:8025', '54325:1025']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: API and isolated E2E database
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/" .env
          sh scripts/setup-local-db.sh
          DB_DATABASE=myridenepal_e2e php artisan migrate --database=pgsql_owner --force
          DB_DATABASE=myridenepal_e2e php artisan db:seed --force
      - working-directory: frontend
        # The mobile project is a Chromium device profile; --with-deps installs WebKit's system libraries on the runner.
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
          pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'playwright-traces-${{ matrix.project }}', path: frontend/test-results, retention-days: 7 }
