name: CI

on:
  push:
  pull_request:

# Two independent jobs: the Laravel API, and the public website in frontend/ (its own package.json and lockfile).
# Local development uses the Supabase CLI's Postgres; CI uses the same PostgreSQL major version as a plain service
# container (no Supabase account or keys involved). The staff portal has its own CI in the Road-trip-admin repo.
env:
  PHP_VERSION: '8.3'
  NODE_VERSION: 24
  PNPM_VERSION: 12.16.1

jobs:
  backend:
    name: Laravel tests, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - name: Environment and databases
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/" .env
          sh scripts/setup-local-db.sh
      - run: php artisan test

  frontend:
    name: Public website (lint, types, unit tests, build, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build-only
      - run: pnpm audit --prod

  frontend-e2e:
    name: Public website E2E against the API
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['54324:8025', '54325:1025']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: API and isolated E2E database
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/" .env
          sh scripts/setup-local-db.sh
          DB_DATABASE=myridenepal_e2e php artisan migrate --database=pgsql_owner --force
          DB_DATABASE=myridenepal_e2e php artisan db:seed --force
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium firefox webkit && pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }
