openapi: 3.0.3
info:
  title: 'My Ride Nepal API Documentation'
  description: 'REST API of My Ride Nepal (/api/v1). The web SPA and the admin SPA authenticate with Laravel Sanctum cookie sessions: GET /sanctum/csrf-cookie, then send the X-XSRF-TOKEN header on every state-changing request. Errors are JSON: {message, errors?}. Validation errors use HTTP 422; unauthenticated 401; forbidden 403; password confirmation required 423; rate limited 429.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:5180'
tags:
  -
    name: Endpoints
    description: ''
paths:
  /api/v1/health:
    get:
      summary: ''
      operationId: getApiV1Health
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/auth/register:
    post:
      summary: ''
      operationId: postApiV1AuthRegister
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 60 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - display_name
                - email
                - password
      security: []
  '/api/v1/auth/verify-email/{id}/{hash}':
    get:
      summary: ''
      operationId: getApiV1AuthVerifyEmailIdHash
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify email.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/auth/email/resend:
    post:
      summary: ''
      operationId: postApiV1AuthEmailResend
