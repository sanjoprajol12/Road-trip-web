  '/api/v1/admin/routes/{route}/segments':
    put:
      summary: "Replaces the ordered segment list. Existing segments (sent with their id) keep their id, so\nroad reports filed against them stay attached; segments left out are removed."
      operationId: replacesTheOrderedSegmentListExistingSegmentssentWithTheirIdKeepTheirIdSoRoadReportsFiledAgainstThemStayAttachedSegmentsLeftOutAreRemoved
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  description: 'Must not have more than 60 items.'
                  example: null
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: 'Must be a valid UUID.'
                        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                        nullable: true
                      start_name:
                        type: string
                        description: 'Must not be greater than 80 characters.'
                        example: g
                      end_name:
                        type: string
                        description: 'Must not be greater than 80 characters.'
                        example: z
                      start_lat:
                        type: number
                        description: 'Must be between 26 and 31.'
                        example: 26
                        nullable: true
                      start_lng:
                        type: number
                        description: 'Must be between 80 and 89.'
                        example: 80
                        nullable: true
                      end_lat:
                        type: number
                        description: 'Must be between 26 and 31.'
                        example: 26
                        nullable: true
                      end_lng:
                        type: number
                        description: 'Must be between 80 and 89.'
                        example: 81
                        nullable: true
                      distance_km:
                        type: number
                        description: 'Must be between 0.1 and 1000.'
                        example: 1
                        nullable: true
                      surface:
                        type: string
                        description: ''
                        example: architecto
                      notes:
                        type: string
                        description: 'Must not be greater than 2000 characters.'
                        example: 'n'
                        nullable: true
                    required:
                      - start_name
                      - end_name
                      - surface
      security: []
    parameters:
      -
        in: path
        name: route
        description: 'The route.'
        example: architecto
        required: true
        schema:
          type: string
